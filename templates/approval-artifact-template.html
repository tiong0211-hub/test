<!--
  발행자 검수(승인/거절) 페이지 템플릿 - 참고용

  이 파일은 참고 템플릿이며, 실제 매일의 검수 페이지는 Claude가 그날의 뉴스레터
  내용(주제, 다이어그램, 설명, 확장 사고)을 채워 Artifact 도구로 매일 새로
  게시(publish)한다. 게시 시 `capabilities: { db: {...} }`를 선언해야 승인/거절
  버튼이 상태를 저장할 수 있다. 정확한 런타임 API는 발행 직전에
  `artifact-capabilities` 스킬을 로드해 확인할 것 (여기 적힌 window.claude.* 호출은
  구조를 보여주기 위한 예시이며 실제 계약과 다를 수 있음).

  치환할 플레이스홀더:
    {{DATE}}, {{CATEGORY}}, {{TOPIC_TITLE}}, {{DIAGRAM_SVG_OR_IMG}},
    {{DIAGRAM_CAPTION}}, {{CROSS_DISCIPLINE_TEXT}}

  저장하는 데이터:
    collection: "newsletter/decisions", doc_id: "{{DATE}}"
    data: { status: "approved" | "rejected", decidedAt: <ISO timestamp> }

  ②번 트리거(승인 확인 & 발송)는 이 문서를 read_db로 조회해 오늘자 상태를 확인한다.
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>뉴스레터 검수 - {{DATE}}</title>
  <style>
    :root { --bg:#f4f5f7; --card:#ffffff; --text:#111827; --muted:#6b7280; --accent:#1f4f9c; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg:#0b1220; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#7fb2ff; }
    }
    :root[data-theme="dark"] { --bg:#0b1220; --card:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#7fb2ff; }
    body { background:var(--bg); color:var(--text); font-family:'Segoe UI', Arial, sans-serif; margin:0; padding:24px; }
    .card { max-width:600px; margin:0 auto; background:var(--card); border-radius:8px; padding:32px; }
    .badge { display:inline-block; background:var(--accent); color:#fff; font-size:12px; font-weight:600; padding:4px 10px; border-radius:12px; }
    h1 { font-size:22px; margin:12px 0 0; }
    .caption { color:var(--muted); font-size:13px; }
    .actions { margin-top:24px; display:flex; gap:12px; }
    button { flex:1; padding:12px; font-size:14px; font-weight:600; border:none; border-radius:6px; cursor:pointer; }
    .approve { background:#1d9a5b; color:#fff; }
    .reject { background:#c53030; color:#fff; }
    #status { margin-top:16px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">{{CATEGORY}}</span>
    <h1>{{TOPIC_TITLE}}</h1>
    <p class="caption">{{DATE}} 발행 예정</p>

    {{DIAGRAM_SVG_OR_IMG}}
    <p class="caption">{{DIAGRAM_CAPTION}}</p>

    <p style="font-size:14px; line-height:1.7;">{{CROSS_DISCIPLINE_TEXT}}</p>

    <div class="actions">
      <button class="approve" onclick="decide('approved')">승인 · 고객 발송</button>
      <button class="reject" onclick="decide('rejected')">거절 · 발송 안 함</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    async function decide(status) {
      document.getElementById('status').textContent = '처리 중...';
      try {
        // 실제 구현은 artifact-capabilities 스킬의 db 쓰기 계약을 따를 것.
        await window.claude.db.write({
          op: 'set',
          collection: 'newsletter/decisions',
          doc_id: '{{DATE}}',
          data: { status: status, decidedAt: new Date().toISOString() },
        });
        document.getElementById('status').textContent =
          status === 'approved' ? '승인되었습니다. 곧 고객에게 발송됩니다.' : '거절되었습니다. 오늘은 발송되지 않습니다.';
      } catch (e) {
        document.getElementById('status').textContent = '처리 중 오류가 발생했습니다: ' + e.message;
      }
    }
  </script>
</body>
</html>
