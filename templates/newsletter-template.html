<!--
  Plant Engineer Daily Insight - 뉴스레터 템플릿

  치환할 플레이스홀더:
    {{DATE}}                - 발행일 (예: 2026년 9월 8일)
    {{CATEGORY}}            - 분야 배지 (예: 기계공학)
    {{TOPIC_TITLE}}         - 오늘의 주제 제목
    {{PREHEADER}}           - 받은편지함 미리보기 텍스트 (1문장 요약)
    {{DIAGRAM_IMAGE_URL}}   - 다이어그램 이미지 URL (PNG 권장, 이메일 클라이언트 SVG 미지원 대응)
    {{DIAGRAM_ALT}}         - 다이어그램 대체 텍스트 (접근성)
    {{DIAGRAM_CAPTION}}     - 다이어그램 간략 설명 (1~2문장)
    {{CROSS_DISCIPLINE_TEXT}} - 다른 분야로 확장한 사고 (플랜트 엔지니어 관점)
    {{SENDER_NAME}}         - 발신자/뉴스레터 이름
    {{SENDER_ADDRESS}}      - 발신자 주소 (법적 고지용)
    {{UNSUBSCRIBE_URL}}     - 구독취소 링크

  발송 시 아래 헤더를 함께 설정해 원클릭 수신거부를 지원할 것:
    List-Unsubscribe: <{{UNSUBSCRIBE_URL}}>
    List-Unsubscribe-Post: List-Unsubscribe=One-Click
-->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TOPIC_TITLE}}</title>
</head>
<body style="margin:0; padding:0; background:#f4f5f7; font-family:'Segoe UI', Arial, sans-serif;">
  <!-- 받은편지함 미리보기 텍스트 (화면에는 숨김) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{PREHEADER}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden; max-width:600px;">

          <!-- 헤더 -->
          <tr>
            <td style="background:#0f2a4a; padding:20px 32px;">
              <span style="color:#9fc4ff; font-size:13px; letter-spacing:1px;">PLANT ENGINEER DAILY INSIGHT · {{DATE}}</span>
            </td>
          </tr>

          <!-- 분야 배지 + 오늘의 주제 -->
          <tr>
            <td style="padding:32px 32px 8px;">
              <span style="display:inline-block; background:#eaf1ff; color:#1f4f9c; font-size:12px; font-weight:600; padding:4px 10px; border-radius:12px;">{{CATEGORY}}</span>
              <h1 style="margin:12px 0 0; font-size:22px; color:#111827;">{{TOPIC_TITLE}}</h1>
            </td>
          </tr>

          <!-- 다이어그램 -->
          <tr>
            <td style="padding:16px 32px;">
              <img src="{{DIAGRAM_IMAGE_URL}}" alt="{{DIAGRAM_ALT}}" width="536" style="width:100%; max-width:536px; display:block; border-radius:6px; border:1px solid #e5e7eb;">
              <p style="margin:10px 0 0; font-size:13px; color:#6b7280; line-height:1.5;">{{DIAGRAM_CAPTION}}</p>
            </td>
          </tr>

          <!-- 다른 분야로의 확장 사고 -->
          <tr>
            <td style="padding:8px 32px 32px;">
              <h2 style="font-size:15px; color:#111827; margin:0 0 8px;">플랜트 엔지니어를 위한 확장된 생각</h2>
              <p style="font-size:14px; color:#374151; line-height:1.7; margin:0; white-space:pre-line;">{{CROSS_DISCIPLINE_TEXT}}</p>
            </td>
          </tr>

          <!-- 푸터 (법적 요건 + 구독취소) -->
          <tr>
            <td style="background:#f9fafb; padding:20px 32px; border-top:1px solid #e5e7eb;">
              <p style="font-size:11px; color:#9ca3af; margin:0 0 6px;">{{SENDER_NAME}} · {{SENDER_ADDRESS}}</p>
              <p style="font-size:11px; color:#9ca3af; margin:0;">
                이 메일은 구독에 동의하신 분께 발송되었습니다.
                <a href="{{UNSUBSCRIBE_URL}}" style="color:#6b7280;">구독취소</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
